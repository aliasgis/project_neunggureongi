services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: neunggureongi-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: neunggureongi
      POSTGRES_USER: neung
      POSTGRES_PASSWORD: neungpass
    ports:
      - "5432:5432"
    volumes:
      - neunggureongi_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neung -d neunggureongi"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  neunggureongi_pgdata:
